name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.changes.outputs.scope }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed paths fail closed
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git -c core.quotepath=true diff --name-only --diff-filter=ACDMRTUXB "$BASE_SHA" "$HEAD_SHA" > .ci-changed-files
          else
            : > .ci-changed-files
          fi
          python3 scripts/audit_ci.py classify --paths-file .ci-changed-files --github-output "$GITHUB_OUTPUT"

      - name: Install uv and Python with bounded cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked environment
        run: uv sync --all-extras --locked

      - name: Validate pre-commit configuration
        run: uv run --locked pre-commit validate-config

      - name: Audit CI policy
        run: uv run --locked python scripts/audit_ci.py audit

      - name: Validate repository governance
        run: uv run --locked python scripts/validate_repository.py

      - name: Verify preflight did not change tracked files
        run: git diff --exit-code

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  quality-ubuntu:
    name: Quality (ubuntu-latest)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.preflight.outputs.scope == 'full'
    permissions:
      contents: read
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python with bounded cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked environment
        run: uv sync --all-extras --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Type-check
        run: uv run --locked mypy src

      - name: Test with authoritative branch coverage and no network
        run: uv run --locked pytest

      - name: Build distributions
        run: uv build

      - name: Verify gates did not change tracked files
        run: git diff --exit-code

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  quality-macos:
    name: Quality (macos-latest)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.preflight.outputs.scope == 'full'
    permissions:
      contents: read
    needs: preflight
    timeout-minutes: 20
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python with bounded cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked environment
        run: uv sync --all-extras --locked

      - name: Run complete platform suite without redundant coverage
        run: uv run --locked pytest --no-cov

      - name: Verify tests did not change tracked files
        run: git diff --exit-code

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  quality-windows:
    name: Quality (windows-latest)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.preflight.outputs.scope == 'full'
    permissions:
      contents: read
    needs: preflight
    # The complete suite reached 99% after 19m19s on the 2026-08-08 hosted
    # Windows image. Keep a bounded five-minute completion/cleanup margin.
    timeout-minutes: 25
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python with bounded cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked environment
        run: uv sync --all-extras --locked

      - name: Run complete platform suite without redundant coverage
        run: uv run --locked pytest --no-cov

      - name: Verify tests did not change tracked files
        run: git diff --exit-code

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
