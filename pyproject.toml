[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openardp"
version = "0.1.0rc1"
description = "Local-first foundation for reusable, provenance-rich agent-ready documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenARDP contributors" }]
dependencies = [
  "pydantic>=2.12.5,<2.13",
  "rfc8785>=0.1.4,<0.2",
]

[project.scripts]
openardp = "openardp.interfaces.cli:main"

[project.optional-dependencies]
docling = [
    "docling==2.114.0",
]
visual = [
    "Pillow==12.3.0",
    "pypdfium2==5.12.1",
]
semantic = [
    "huggingface-hub==1.24.0",
    "safetensors==0.8.0",
    "torch==2.13.0",
    "transformers==5.8.1",
]

[dependency-groups]
dev = [
  "jsonschema>=4.24,<5",
  "mypy>=1.16,<2",
  "pre-commit>=4.4,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-socket>=0.7,<1",
  "ruff>=0.12,<1",
]

[tool.uv]
required-version = "==0.11.31"
default-groups = ["dev"]
preview-features = ["centralized-project-envs"]

[tool.hatch.build.targets.wheel]
packages = ["src/openardp"]

[tool.hatch.build.targets.sdist]
include = [
  "LICENSE",
  "README.md",
  "pyproject.toml",
  "src/openardp",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF", "D"]
ignore = ["S101", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["openardp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
required_plugins = ["pytest-cov>=6.2", "pytest-socket>=0.7"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--disable-socket",
  "--cov=openardp",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
  "-q",
]

[tool.coverage.run]
branch = true
source = ["openardp"]

[tool.coverage.report]
show_missing = true
fail_under = 85
